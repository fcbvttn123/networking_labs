---
- name: Ensure report directory exists
  ansible.builtin.file:
    path: "{{ report_directory }}"
    state: directory
    mode: "0700"

- name: Generate network inventory HTML report
  ansible.builtin.template:
    src: inventory.html.j2
    dest: "{{ report_directory }}/inventory.html" # the "report_directory" variable comes directly from the "vars:" section defined in the playbook, NOT from "inventory/group_vars/ios.yml"
    mode: "0600"
