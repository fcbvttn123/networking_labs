---
- name: Apply Network Baseline and VLAN Standards
  hosts: datacenter_switches
  gather_facts: false

  tasks:
    - name: Ensure standard VLANs are present
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.id }}"
            name: "{{ item.name }}"
            state: active
        state: merged
      loop: "{{ switch_vlans }}"

    - name: Configure global DNS servers
      cisco.ios.ios_system:
        name_servers: "{{ dns_servers }}"
        state: present

    - name: Configure NTP server baseline
      cisco.ios.ios_ntp:
        config:
          servers: "{{ ntp_server }}"
        state: merged

    - name: Save running configuration to startup configuration
      cisco.ios.ios_config:
        save_when: modified
