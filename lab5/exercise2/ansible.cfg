# file name must be ansible.config
[defaults]
inventory = ./inventory/hosts.yml
roles_path = ./roles
host_key_checking = True # when ansible connects to a new device, it validates the host key against known hosts (enforces strict ssh verification for remote connections)
retry_files_enabled = False # disables the creation of .retry files whenever a playbook fails
interpreter_python = auto_silent # automatically detects the correct Python interpreter on target nodes without printing warning messages to your console, keeping execution logs clean

[persistent_connection]
connect_timeout = 30
command_timeout = 60